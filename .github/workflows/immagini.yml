# Costruisce e pubblica su GHCR le immagini di produzione a ogni tag v*.
# Il deploy resta manuale (infra/produzione/scripts/deploy.sh): i nodi Proxmox
# non sono raggiungibili da GitHub, e l'aggiornamento di un servizio pubblico
# va avviato da chi può verificarlo.
name: Immagini

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: citta-portal
            contesto: .
            dockerfile: Dockerfile
            target: runner
            app: citta-semplice-portal
          - nome: citta-office
            contesto: .
            dockerfile: Dockerfile
            target: runner
            app: citta-semplice-office
          - nome: citta-migrator
            contesto: .
            dockerfile: Dockerfile
            target: migrator
            app: ""
          - nome: citta-cron
            contesto: infra/produzione/cron
            dockerfile: infra/produzione/cron/Dockerfile
            target: ""
            app: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR vuole il nome in minuscolo.
          images: ghcr.io/salvinoporto/${{ matrix.nome }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contesto }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            APP=${{ matrix.app }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}
