# /etc/keepalived/keepalived.conf sui nodi swarm (sw-01..03).
# VIP d'ingresso 10.20.0.10: il firewall perimetrale fa DNAT 80/443 su questo IP.
# Su sw-02 e sw-03 cambiare priority (90, 80), unicast_src_ip e unicast_peer.
#
# Proxmox: se sul NIC della VM è attivo "IP filter", aggiungere il VIP all'ipset
# ipfilter-net0 della VM, altrimenti i pacchetti verso il VIP vengono scartati.

global_defs {
  enable_script_security
  script_user keepalived_script
}

# Il VIP resta solo dove Traefik risponde davvero sulla 443.
vrrp_script traefik_vivo {
  script "/usr/bin/timeout 2 /bin/bash -c '</dev/tcp/127.0.0.1/443'"
  interval 3
  fall 2
  rise 2
}

vrrp_instance INGRESSO {
  state BACKUP
  interface ens18
  virtual_router_id 20
  priority 100
  advert_int 1
  # Unicast: niente dipendenza dal multicast sul bridge/switch.
  unicast_src_ip 10.20.0.11
  unicast_peer {
    10.20.0.12
    10.20.0.13
  }
  virtual_ipaddress {
    10.20.0.10/24 dev ens18
  }
  track_script {
    traefik_vivo
  }
}
