# /etc/keepalived/keepalived.conf sulle VM Garage (s3-01..03).
# VIP S3 10.30.0.20 = S3_ENDPOINT delle app. Ogni nodo Garage serve qualunque
# oggetto: il VIP serve solo a non legare le app a un singolo nodo.
# Su s3-02 e s3-03 cambiare priority, unicast_src_ip e unicast_peer.

global_defs {
  enable_script_security
  script_user keepalived_script
}

# /health dell'API admin risponde 200 solo se il nodo vede il quorum del cluster.
vrrp_script garage_vivo {
  script "/usr/bin/curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3903/health"
  interval 3
  fall 2
  rise 2
}

vrrp_instance S3 {
  state BACKUP
  interface ens18
  virtual_router_id 30
  priority 100
  advert_int 1
  unicast_src_ip 10.30.0.21
  unicast_peer {
    10.30.0.22
    10.30.0.23
  }
  virtual_ipaddress {
    10.30.0.20/24 dev ens18
  }
  track_script {
    garage_vivo
  }
}
