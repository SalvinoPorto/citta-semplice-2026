# /etc/postgresql/17/main/conf.d/99-citta.conf su pg-01 e pg-02.
# Valori per una VM da 8 vCPU / 32 GB su NVMe; riscalare shared_buffers (25%
# della RAM) ed effective_cache_size (75%) se la VM è diversa.

listen_addresses = '*'
port = 5432
timezone = 'Europe/Rome'
password_encryption = scram-sha-256

# Connessioni: vedi il budget in infra/produzione/stack.yml (DATABASE_POOL_MAX).
max_connections = 200

# Memoria
shared_buffers = 8GB
effective_cache_size = 24GB
maintenance_work_mem = 1GB
work_mem = 16MB

# Disco NVMe
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL e checkpoint
wal_level = replica
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
wal_compression = zstd

# Replica in streaming verso pg-02
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
hot_standby_feedback = on
# Uno standby spento non deve riempire il disco del primario trattenendo WAL.
max_slot_wal_keep_size = 20GB

# Archiviazione WAL continua (point-in-time recovery) con pgBackRest
archive_mode = on
archive_command = 'pgbackrest --stanza=citta archive-push %p'
archive_timeout = 60s

# Osservabilità
shared_preload_libraries = 'pg_stat_statements'
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
log_autovacuum_min_duration = 10s
track_io_timing = on
