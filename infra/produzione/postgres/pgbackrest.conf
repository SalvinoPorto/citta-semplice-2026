# /etc/pgbackrest/pgbackrest.conf su pg-01 (e pg-02, pronto per il failover).
[global]
# repo1: disco di backup montato dalla VLAN di gestione (NFS dal PBS/NAS).
repo1-path=/mnt/backup-pg
repo1-retention-full=4
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=CAMBIARE-openssl-rand-base64-48

# repo2: copia fuori sede (secondo sito o storage S3 esterno all'ente).
# Senza, un incidente al datacenter si porta via database e backup insieme.
#repo2-type=s3
#repo2-s3-endpoint=...
#repo2-s3-bucket=...
#repo2-s3-region=...
#repo2-path=/citta
#repo2-retention-full=8
#repo2-cipher-type=aes-256-cbc
#repo2-cipher-pass=...

process-max=4
compress-type=zst
start-fast=y
log-level-console=info
log-level-file=detail

[citta]
pg1-path=/var/lib/postgresql/17/main
